<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metropolis Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div id="hud">
        SKOR: <span id="score">0</span> PTS
    </div>

    <div id="menuOverlay" class="overlay">
        <div class="card">
            <h1>METROPOLIS SNAKE</h1>
            <p>WASD / Panah / Tombol di Layar</p>
            <span>TEKAN [ ENTER / KLIK ] UNTUK MAIN</span>
        </div>
    </div>

    <div id="gameOverOverlay" class="overlay hidden">
        <div class="card">
            <h1>GAME OVER!</h1>
            <p>TOTAL SKOR AKHIR: <span id="finalScore">0</span></p>
            <span>TEKAN [ ENTER / KLIK ] MAIN ULANG</span>
        </div>
    </div>

    <div id="controls">
        <button id="up">▲</button>
        <button id="left">◄</button>
        <button id="down">▼</button>
        <button id="right">►</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
